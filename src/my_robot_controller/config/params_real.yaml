# ============================================================
# Tham số cho XE THẬT (Raspberry Pi + Camera + BTS7960)
# Dùng với: ros2 launch luanvan_control real_robot.launch.py
# ============================================================

cnn_driver_node:
  ros__parameters:
    # Đường dẫn model CNN UNet-ResNet34 ONNX (Input 384x384 RGB, Output Sigmoid [0, 1])
    model_path: 'models/crop_row_cnn_best.onnx'
    # Đường dẫn model YOLO11n ONNX nhận diện Mũi tên Vàng & Đen (bao1.onnx)
    yolo_model_path: 'models/bao1.onnx'
    # Kích thước input mạng CNN: 384x384 (Khớp 100% chuẩn model_info.json)
    input_height: 384
    input_width: 384
    save_debug_imgs: false

    # Cấu hình Topics đồng bộ cảm biến trên xe thật
    image_topic: '/camera/color/image_raw'
    depth_topic: '/camera/depth/image_raw'
    enable_depth_safety: true
    depth_estop_dist: 0.22      # m — Phanh khẩn cấp 3D quang học khi có chướng ngại tầm thấp sát mũi
    odom_topic: '/odometry/filtered'
    imu_topic: '/imu/data'

    # Không sử dụng mặt nạ HSV trên xe thật (dùng model ONNX)
    use_hsv_mask: false

    mask_threshold: 0.35        # cao hơn sim vì model nhận diện ảnh thật tốt hơn

    # Tốc độ di chuyển (m/s) — Chuẩn 0.07 m/s (~7.5 RPM thực tế trên đất cỏ) khỏe dư lực vượt mô đất nhỏ
    linear_speed: 0.07
    turn_linear_speed: 0.07           # m/s — Duy trì đủ lực 7 cm/s khi tiếp cận mũi tên trên nền cỏ gồ ghề
    turn_angular_speed: 0.48          # rad/s — Vận tốc góc xoay 4 bánh ngược chiều khỏe khoắn (~13.8 RPM cả 4 bánh)
    yellow_arrow_turn_dist: 0.50      # m — Khi gặp Điều kiện 1 (Mũi tên Vàng) cách còn <= 0.50m thì kích hoạt quay đầu
    yellow_arrow_turn_angle_deg: 90.0 # độ — Khi gặp Điều kiện 1 (Mũi tên Vàng <= 0.50m), quay phải 90° tìm Điều kiện 2 (Mũi tên Đen)
    turn_in_place_threshold_deg: 30.0 # Ngưỡng dừng xoay tại chỗ: xe luôn VỪA CHẠY VỪA UỐN LƯỢN MƯỢT MÀ
    turn_in_place_resume_deg: 10.0    # Ngưỡng xong việc xoay: góc lệch <= 10.0° là lập tức tiếp tục chạy tiến

    # Bộ điều khiển trượt SMC bám luống với lực bẻ lái êm dịu, không giật cục (Phong cách A)
    lambda_smc: 2.0             # hệ số bề mặt trượt S = de + lambda * e (làm trơn phản ứng)
    k_smc: 2.8                  # hệ số hồi tiếp mô-men quay êm ái, bẻ lái mượt mà về tim hàng
    eta_smc: 0.25               # hệ số chuyển mạch mềm (chống rung chattering vi sai)
    phi_smc: 0.50               # bề dày lớp biên trượt làm trơn điều khiển

    kp: 1.5                     # hệ số tỷ lệ
    max_steering_angle_deg: 16.0 # góc bẻ lái tối đa 16.0 độ giúp xe uốn cong mượt mà về giữa hàng
    ema_alpha: 0.35             # bộ lọc trung bình động EMA mượt mà

    # ── Lá Chắn An Toàn & Định Tâm Sườn Vật Lý Bằng LiDAR C1 (LiDAR Active Guard) ──
    # Khoảng cách đo từ tâm LiDAR. Ngưỡng sườn luôn phải > robot_half_width (node tự nâng nếu đặt sai).
    # • Định tâm liên tục (Active Centering): Tự động bù góc lái kéo xe về tim luống khi lệch ngang
    # • Sườn < side_near_dist: Virtual Repulsion bẻ lái thoát + tăng độ nhạy lái
    # • Sườn < side_critical_dist: giảm 50% tốc độ tiến
    # • Sườn < side_emergency_dist: bò chậm (side_emergency_speed_ratio) + lái gắt, KHÔNG xoay tại chỗ
    # • Mũi < front_stop_dist: dừng chờ thoáng | Mũi < lidar_estop_dist: phanh phản xạ 15Hz
    robot_half_width: 0.34            # m — tâm xe tới mép bánh ngoài
    front_stop_dist: 0.22             # m
    lidar_estop_dist: 0.20            # m (phải <= front_stop_dist)
    side_near_dist: 0.42              # m — mép bánh cách hàng 8cm
    side_critical_dist: 0.39          # m — mép bánh cách hàng 5cm
    side_emergency_dist: 0.36         # m — mép bánh cách hàng 2cm
    side_emergency_speed_ratio: 1.00  # × linear_speed khi tới hạn (giữ nguyên 0.07 m/s để không bao giờ mất đà vượt mô đất cỏ)

    # Khoảng cách giữa 2 hàng luống thực tế (m)
    row_spacing: 1.20           # Hàng cách hàng 1.20m (chuẩn 3 hàng cây bắp / 2 luống)
    min_row_length: 0.40        # m — chỉ cần xe đã vào luống >= 0.40m, khi hết nhìn thấy hàng là lập tức kích hoạt chạy thẳng 1.80m (DRIVE_OUT)

    # Ngưỡng confidence — CAO hơn sim vì ảnh thật cho mask rõ ràng hơn
    low_confidence_threshold: 0.30
    high_confidence_threshold: 0.55

    # Chế độ chạy: TỰ HÀNH KHÉP KÍN BÁM LUỐNG + TỰ ĐỘNG QUAY ĐẦU SANG LUỐNG 2
    enable_uturn: true
    low_conf_frames_threshold: 8  # 8 frame liên tiếp thấy hết cây / confidence giảm dưới 30%
    max_row_length: 100.0         # m — cho phép chạy luống dài thực tế đến 100m

    # ── Điều Phối Nhiệm Vụ ──
    wait_for_rviz_start: false     # Tự động xuất phát ngay khi bật node
    enable_mission_goals: false    # TẮT ép mốc 3.0m để xe chạy tracking luống dài thực tế liên tục
    enable_global_plan_assist: false # Thuần bám Camera AI + LiDAR Corridor Centering thực tế
    field_length: 3.0              # m — Chiều dài mỗi luống (3.0m)
    headland_area_length: 4.0      # m — Khoảng không gian quay đầu 4.0m
    goal_tolerance: 0.40           # m — Bán kính dung sai chạm mốc

    # Tọa độ các điểm mốc (hệ tọa độ odom xuất phát từ đầu Luống 1)
    goal_1_x: 3.0                  # m — Cuối Luống 1 (kích hoạt quay đầu)
    goal_1_y: 0.0                  # m
    goal_2_x: 3.0                  # m — Đầu Luống 2 (sau khi quay đầu 180°)
    goal_2_y: -1.20                # m
    goal_3_x: 0.0                  # m — Cuối Luống 2 (về đích dừng xe an toàn)
    goal_3_y: -1.20                # m

    # ── Tham số Quỹ Đạo Omega Turn (Chống trượt bánh vi sai cho xe 58x60cm) ────────
    turn_side: 'RIGHT'             # Chuyển sang luống bên phải (y = -1.20m)
    omega_open_angle_deg: 35.0     # độ — Góc mở cua trái
    omega_r1: 0.85                 # m — Bán kính cung mở trái (nâng từ 0.65 lên 0.85m chống cày đất vi sai)
    omega_clearance: 0.25          # m — Đoạn thẳng thoát đầu luống trong cung Omega
    omega_lead_in: 0.50            # m — Đoạn dẫn thẳng vào tim Luống 2 (nâng từ 0.40 lên 0.50m nắn thẳng camera)

    # Đoạn chạy thẳng thoát hẳn luống (DRIVE_OUT) trước khi quay đầu hoặc dừng xe
    drive_out_distance: 1.80       # m — Quãng đường chạy thẳng giữ hướng IMU thoát hẳn đầu luống (1.5m - 2.0m)
    drive_out_max_time: 50.0       # s — Watchdog thời gian chạy thoát đầu luống ở 0.05 m/s (~36s cho 1.8m)

    warmup_time: 3.0
    drive_out_time: 30.0
    min_turn_time: 8.0

    # Tham số GPS & Geodetic Datum Origin (Tọa độ WGS-84 gốc)
    datum_latitude: 10.775667       # độ (Latitude)
    datum_longitude: 106.670889     # độ (Longitude)
    datum_altitude: 10.0            # m (Altitude)
    gps_topic: '/gps/fix'

    # Cấu hình xuất Log & Chuẩn hóa Terminal
    enable_file_logging: true
    log_output_dir: 'logs'
    terminal_log_interval: 1.0     # s — chu kỳ in thông tin trạng thái chuẩn ra terminal

gps_driver_node:
  ros__parameters:
    serial_port: '/dev/ttyAMA0'
    baudrate: 38400
    frame_id: 'gps_link'
    publish_topic: '/gps/fix'

bts7960_driver_node:
  ros__parameters:
    wheel_base: 0.58            # m (đo thực tế khoảng cách tâm 2 bánh)
    max_linear_speed: 0.16      # m/s = 100% PWM (ở 0.07 m/s đạt ~44% PWM, tạo xung khỏe cho motor 775 220RPM vượt cản)
    min_duty_cycle: 38.0        # % — Sàn 38% PWM đảm bảo motor 775 có hộp số luôn đủ mô-men xoắn thắng ma sát tĩnh
    pwm_frequency: 1500         # Hz — Tần số xung tối ưu độ đầm êm và lực kéo trầm cho motor 775 có chổi than

    # GPIO BCM pin numbers — chỉnh theo sơ đồ nối dây thực tế
    left_rpwm_pin:  17
    left_lpwm_pin:  27
    left_en_pin:    22
    right_rpwm_pin: 23
    right_lpwm_pin: 24
    right_en_pin:   25

# Cấu hình Bản đồ Chi phí Thời gian thực (Real-time Costmap cho RViz)
costmap_node:
  ros__parameters:
    inscribed_radius: 0.35      # m — Bán kính thân xe (35cm theo kích thước thực tế)
    inflation_radius: 0.45      # m — Tổng đệm tính từ gốc cây (45cm). Với hàng cách 1.2m, chừa lối thông 30cm ở giữa
    cost_scaling_factor: 10.0   # Hệ số suy giảm dải màu chi phí (98 -> 1)
    obstacle_threshold: 40      # Ngưỡng tích lũy quét LiDAR nhận diện thân cây
    resolution: 0.05            # m — Độ phân giải ô lưới (5cm/ô)
    map_length_m: 60.0          # m — Chiều dài bao phủ dọc luống
    map_width_m: 20.0           # m — Chiều rộng bao phủ
    publish_rate: 4.0           # Hz — Tần số xuất bản mượt mà lên RViz
